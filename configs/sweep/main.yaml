# Main preregistered sweep: 4 learned methods x 5 seeds. Budgets are per run, in env steps.
seeds: [0, 1, 2, 3, 4]
methods:
  ppo:    {config: configs/agent/ppo.yaml,    overrides: [train.steps=300000], slots: 8}
  sac:    {config: configs/agent/sac.yaml,    overrides: [train.steps=300000], slots: 2}
  mbrl:   {config: configs/agent/mbrl.yaml,   overrides: [train.steps=50000],  slots: 16}
  pimbrl: {config: configs/agent/pimbrl.yaml, overrides: [train.steps=50000],  slots: 16}
cpu_slots: 20     # one slot = one CPU core; a job runs when its slots fit
