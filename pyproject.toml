[project]
name = "gymtorax-baselines"
version = "0.1.0"
description = "Classical, model-free and model-based RL baselines for tokamak plasma control in Gym-TORAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shushant Kumar Choudhary" }]
requires-python = ">=3.12"
dependencies = [
    "gymtorax==1.1.1",
    "numpy>=2.0",
    "optuna>=5.0.0",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "stable-baselines3>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gtb"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: runs TORAX episodes (seconds to minutes)"]

[tool.ruff]
line-length = 110
